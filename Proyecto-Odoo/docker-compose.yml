services:
  web:
    image: odoo:17.0
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
    networks:
      - erp-net

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - erp-net

volumes:
  odoo-web-data:
  postgresql-data:

networks:
  erp-net:
    driver: bridge